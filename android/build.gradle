allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url ("https://jitpack.io/") }
    }
}

def newBuildDir = rootProject.layout.buildDirectory.dir('../../build').get()
rootProject.layout.buildDirectory.value(newBuildDir)
subprojects {
    project.layout.buildDirectory.value(newBuildDir.dir(project.name))
}
subprojects {
    afterEvaluate { project ->
        if (project.plugins.hasPlugin("com.android.application") ||
                project.plugins.hasPlugin("com.android.library")) {
            project.android {
                // One SDK for every module: plugins with an older compileSdk
                // build against it too. 37: permission_handler_android 14.1
                // uses Android 17 APIs (androidx.camera 1.6 needs 36+).
                // targetSdk stays 36.
                compileSdkVersion 'android-37.0'
                if (namespace == null) {
                        namespace project.group
                    }
            }
        }
        
    }
}
// android.builtInKotlin=false (gradle.properties) keeps AGP 9 building the
// plugins that still apply the Kotlin plugin themselves. recaptcha_enterprise_
// flutter instead expects AGP 9's built-in Kotlin and skips the plugin, so
// apply it for that project once its Android library plugin is in place.
subprojects {
    if (project.name == 'recaptcha_enterprise_flutter') {
        project.plugins.withId('com.android.library') {
            project.apply plugin: 'org.jetbrains.kotlin.android'
        }
    }
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
