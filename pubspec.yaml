name: thingsboard_app
description: Flutter ThingsBoard Mobile Application

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 2.0.0+17

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  thingsboard_client:
    git:
      url: https://github.com/thingsboard/dart_thingsboard_client.git
      ref: develop/5.0
  dio: ^5.11.1
  intl: ^0.20.2
  flutter_secure_storage: ^11.2.0
  cupertino_icons: ^1.0.9
  fluro: ^2.0.5
  flutter_svg: ^2.2.2
  jovial_svg: ^1.1.29
  auto_size_text: ^3.0.0
  infinite_scroll_pagination: ^5.1.1
  fading_edge_scrollview: ^4.1.1
  stream_transform: ^2.1.2
  flutter_inappwebview: 6.2.0-beta.3
  url_launcher: ^6.3.2
  image_picker: ^1.2.1
  mime: ^2.1.0
  logger: ^2.8.0
  device_info_plus: ^13.3.0
  geolocator: ^14.1.2
  package_info_plus: ^10.2.2
  dart_jsonwebtoken: ^3.4.1
  crypto: ^3.0.8
  flutter_form_builder: ^10.3.0
  form_builder_validators: ^11.3.0
  preload_page_view: ^0.2.0
  flutter_localizations:
    sdk: flutter
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  firebase_app_installations: ^0.5.1
  flutter_local_notifications: ^22.3.3
  flutter_new_badger: ^2.0.0
  timeago: ^3.7.1
  flutter_bloc: ^9.1.1
  get_it: ^9.3.0
  equatable: ^3.0.0
  app_links: ^7.2.2
  collection: ^1.19.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  modal_bottom_sheet: ^3.0.0
  event_bus: ^2.0.1
  google_fonts: ^9.0.0
  expandable: ^5.0.1
  focused_menu: ^1.0.5
  recaptcha_enterprise_flutter: ^18.9.3
  flutter_esp_ble_prov: ^0.1.7
  esp_smartconfig: ^3.0.0
  permission_handler: ^13.0.2
  open_settings_plus: ^0.5.1
  plugin_wifi_connect: ^2.0.3
  toastification: ^3.2.2
  flutter_widget_from_html: ^0.17.4
  file_picker: ^13.3.2
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  mobile_scanner: ^7.5.0
  flutter_hooks: ^0.21.2
  # Vendored: the upstream plugin is unmaintained since 2022.
  esp_provisioning_softap:
    path: packages/esp_provisioning_softap
  flutter_slidable: ^5.2.0
  flutter_native_splash: ^2.4.6
  super_tooltip: ^2.1.1
  go_router: ^18.1.3
  hooks_riverpod: ^3.4.3
  country_picker: ^2.0.28
  flutter_localized_locales: ^2.0.5
  native_device_orientation: ^2.1.0
  reactive_forms: ^18.2.2
  reactive_phone_form_field: ^5.0.2
  barcode: ^2.2.9
  riverpod_annotation: ^4.0.7
  path_provider: ^2.1.5
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  mocktail: ^1.0.5
  build_runner: ^2.16.2
  lint: ^2.14.0
  riverpod_generator: ^4.0.9
  json_serializable: ^6.15.2
  freezed: ^4.0.3

flutter:
  uses-material-design: true
  # Localizations from lib/l10n (l10n.yaml).
  generate: true
  assets:
    - assets/images/
  fonts:
    # Material Design Icons, the version the ThingsBoard web UI uses
    # (tool/generate_mdi_icons.py).
    - family: MaterialDesignIcons
      fonts:
        - asset: assets/fonts/materialdesignicons-webfont.ttf

flutter_launcher_icons:
  ### android config
  android: "launcher_icon"
  #fallback android icon
  image_path_android: "assets/branding/icon_filled.png"
  # icon config for android 13+
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/branding/icon_foreground.png"
  adaptive_icon_foreground_inset: 16
  adaptive_icon_monochrome: "assets/branding/icon_monochrome.png"
  ###
  ### ios config
  ios: true
  #fallback ios icon
  image_path_ios: "assets/branding/icon_foreground.png"
  background_color_ios: "#ffffff"
  desaturate_tinted_to_grayscale_ios: true
  remove_alpha_ios: true
  # ios 18+ icon 
  image_path_ios_dark_transparent: "assets/branding/icon_foreground.png"
  # ios 26 liquid glass icon currently this config is not implemented
  # image_path_ios_liquid_glass_icon: "assets/branding/icon_liquid_glass_ios.png"
  # liquid_glass_specular_ios: true
  # liquid_glass_blur_ios: 0.2
  # liquid_glass_icon_scale: 0.73
  # liquid_glass_translucency_ios: 0.3
  # liquid_glass_shadow_opacity_ios: 0.3
  ###
