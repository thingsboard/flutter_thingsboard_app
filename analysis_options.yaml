include: package:lint/strict.yaml
analyzer:
  exclude:
    - '**.freezed.dart'
    - '**.g.dart'
    - "**/*.gform.dart"
    - lib/generated/**
    - packages/*/lib/src/proto/**
    - build/**
    - android/**
    - ios/**
  errors: 
    invalid_annotation_target: ignore
linter:
  rules:
    # Util classes are awesome!
    avoid_classes_with_only_static_members: false
    eol_at_end_of_file: false
    require_trailing_commas: false
    use_setters_to_change_properties: false
    sort_pub_dependencies: false
    # Dart 3.13 primary-constructor syntax: adopting it would rewrite most
    # classes.
    use_primary_constructors: false
    unnecessary_type_name_in_constructor: false
    empty_container_bodies: false
    # Make constructors the first thing in every class
    sort_constructors_first: true