name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its previous run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# No Android build here: build locally after native changes (see CONTRIBUTING).
jobs:
  checks:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check license headers
        run: |
          missing=$(git ls-files 'lib/*.dart' 'test/*.dart' 'patrol_test/*.dart' \
            | grep -vE '\.g\.dart$|\.freezed\.dart$|^lib/generated/|^lib/firebase_options\.dart$' \
            | xargs grep -L '^// Copyright © 2021-2026 ThingsBoard, Inc\.' || true)
          if [ -n "$missing" ]; then
            echo "Missing license header (see CONTRIBUTING.md):"; echo "$missing"; exit 1
          fi
      - uses: ./.github/actions/setup-flutter
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test patrol_test
      - name: Check generated code is up to date
        # build_runner (freezed, json_serializable, riverpod) and gen-l10n
        # (run by pub get) outputs are committed.
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- '*.g.dart' '*.freezed.dart' lib/generated
      - name: Analyze
        run: flutter analyze --fatal-infos

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-flutter
      - name: Test
        run: flutter test
